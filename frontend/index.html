<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>RepoAI — the manual your repo never shipped with</title>
    <meta
      name="description"
      content="Paste a GitHub URL. RepoAI parses the source with tree-sitter, indexes it, and answers questions about how it works in plain English."
    />
    <meta name="author" content="Luis-Angel Moreno" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RepoAI — the manual your repo never shipped with" />
    <meta
      property="og:description"
      content="Paste a GitHub URL and ask questions about the codebase in plain English."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,400..700&family=Newsreader:opsz,wght@6..72,300..600&family=Newsreader:ital,wght@1,400&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
