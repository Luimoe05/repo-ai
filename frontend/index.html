<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>RepoAI | Understand your codebase</title>
    <meta
      name="description"
      content="Paste a GitHub URL. RepoAI parses the source with tree-sitter, indexes it, and answers questions about how it works in plain English."
    />
    <meta name="author" content="Luis-Angel Moreno" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RepoAI | Understand your codebase" />
    <meta
      property="og:description"
      content="Paste a GitHub URL and ask questions about the codebase in plain English."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      (function () {
        var t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        try { var saved = localStorage.getItem('theme'); if (saved === 'dark' || saved === 'light') t = saved; } catch (_) {}
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
